x-systemd-container: &systemd-container
  privileged: true
  cgroup: private
  tmpfs:
    - /run
    - /run/lock
  volumes:
    - /sys/fs/cgroup:/sys/fs/cgroup:rw
  stop_signal: SIGRTMIN+3

services:
  kdc1:
    image: asgard/kdc
    hostname: kdc1.example.com
    command: start-kdc
    volumes:
      - kdc1:/var/heimdal

  kdc2:
    image: asgard/kdc
    hostname: kdc2.example.com
    command: start-kdc
    volumes:
      - kdc2:/var/heimdal

  kdc-no-bifrost:
    image: asgard/kdc
    hostname: kdc-no-bifrost.example.com
    command: start-kdc
    environment:
      ASGARD_BIFROST: "0"
    volumes:
      - kdc-no-bifrost:/var/heimdal

  no-bifrost-client:
    image: asgard/client
    hostname: no-bifrost-client.example.com
    command: start-client

  #
  # This is the host on which the administrator
  # will be running commands:
  bastion:
    image: asgard/client
    hostname: bastion.example.com
    command: start-client

  #
  # This host will run a web server that accepts
  # krb5 connections...
  httpserver:
    image: asgard/client
    hostname: httpserver.example.com
    command: start-client

  #
  # This host will run a web server that accepts
  # krb5 connections...
  sshserver:
    image: asgard/client
    hostname: sshserver.example.com
    command: start-client

  #
  # These two hosts share a logical host keytab so the tests can exercise
  # clustered service identities.
  sshcluster-a:
    image: asgard/client
    hostname: sshcluster-a.example.com
    command: start-client

  sshcluster-b:
    image: asgard/client
    hostname: sshcluster-b.example.com
    command: start-client

  #
  # These hosts are otherwise identical clients.  The test harness
  # provisions one with krb5_admin/krb5_keytab and the other with bifrost,
  # then compares the resulting host state.
  client-krb5:
    image: asgard/client
    hostname: client-krb5.example.com
    command: start-client

  client-bifrost:
    image: asgard/client
    hostname: client-bifrost.example.com
    command: start-client

  debian-systemd:
    <<: *systemd-container
    image: asgard/client
    hostname: debian-systemd.example.com
    entrypoint: ["/usr/lib/systemd/systemd"]
    command: []

  #
  # These hosts run the Red Hat RPM image.  The test harness provisions
  # one with krb5_admin/krb5_keytab and one with bifrost, mirroring the
  # Debian client comparison above.
  redhat-krb5:
    profiles: ["redhat"]
    image: bifrost-redhat-dns
    hostname: redhat-krb5.example.com
    command: ["/bin/sh", "-c", "trap 'exit 0' TERM INT; sleep infinity & wait"]
    environment:
      KRB5_CONFIG: /etc/krb5.conf

  redhat-bifrost:
    profiles: ["redhat"]
    image: bifrost-redhat-dns
    hostname: redhat-bifrost.example.com
    command: ["/bin/sh", "-c", "trap 'exit 0' TERM INT; sleep infinity & wait"]
    environment:
      KRB5_CONFIG: /etc/krb5.conf

  #
  # Cross-realm trust matrix.  These are separate from the main
  # EXAMPLE.COM KDCs so the test can exercise real inter-KDC ticket
  # exchange without perturbing the normal Asgard realm.
  xrealm-a:
    image: asgard/kdc
    hostname: xrealm-a.example.com
    command: start-kdc
    volumes:
      - xrealm-a:/var/heimdal

  xrealm-b:
    image: asgard/kdc
    hostname: xrealm-b.example.com
    command: start-kdc
    volumes:
      - xrealm-b:/var/heimdal

  xrealm-ad:
    image: asgard/kdc
    hostname: xrealm-ad.example.com
    command: start-kdc
    volumes:
      - xrealm-ad:/var/heimdal

  xrealm-client:
    image: asgard/client
    hostname: xrealm-client.example.com
    command: start-client

  #
  # Single-appliance, multiple-local-realm coverage.
  multi-kdc:
    image: asgard/kdc
    hostname: multi-kdc.example.com
    command: start-kdc
    volumes:
      - multi-kdc:/var/heimdal

  multi-a:
    image: asgard/client
    hostname: multi-a.example.com
    command: start-client

  multi-b:
    image: asgard/client
    hostname: multi-b.example.com
    command: start-client

volumes:
  kdc1:
  kdc2:
  kdc-no-bifrost:
  xrealm-a:
  xrealm-b:
  xrealm-ad:
  multi-kdc:
