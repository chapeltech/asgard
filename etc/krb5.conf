[libdefaults]
	rdns = false
	pkinit_anchors = FILE:/etc/krb5/ca-pub.pem

[kdc]
	database = {
		dbname = db:/var/heimdal/heimdal
	}
	require-preauth = yes
	check-ticket-addresses = false
	enable-pkinit = yes
	allow-anonymous = yes
	pkinit_anchors = FILE:/etc/krb5/ca-pub.pem
	pkinit_identity = FILE:/var/heimdal/kdc-priv.pem
	enable_kx509 = yes

[logging]
	kdc = 0-3/SYSLOG

includedir /var/heimdal/krb5.conf.d
