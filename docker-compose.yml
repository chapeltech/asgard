services:
  kdc:
    image: ghcr.io/chapeltech/asgard:latest
    hostname: ${ASGARD_HOSTNAME:-kdc.example.com}
    command: start-kdc
    restart: unless-stopped
    environment:
      ASGARD_BIFROST: "${ASGARD_BIFROST:-1}"
    ports: ["53/udp", "53/tcp", "88/udp", "88/tcp",
            "464/tcp", "2666/tcp", "3666/tcp"]
    volumes:
      - kdc:/var/heimdal

volumes:
  kdc:
